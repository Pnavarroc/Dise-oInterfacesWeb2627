<ion-header class="ion-no-border">
  <ion-toolbar color="dark">
    <ion-title class="ion-text-center">Game of Thrones</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-list>
    <swiper-container>

    <swiper-slide>
      @for(char of characters(); track char.id){
      <ion-item [id]="'modal-'+char.id">
        <ion-avatar slot="start">
          <img [src]="char.imageUrl">
        </ion-avatar>
        <ion-label>
          {{char.fullName}}
          <p>{{char.family}}</p>
        </ion-label>
        <ion-badge slot="end" color="warning">{{char.title | slice: 0: 20}}</ion-badge>
      </ion-item>

      <app-got-modal [(favoriteChars)]="favoriteChars" [char]="char"/>

    }
    </swiper-slide>
      <swiper-slide>
        @for (fav of favoriteChars(); track fav.id){
          <ion-item-sliding>
            <ion-item [id]="'modal-'+fav.id">
              <ion-avatar slot="start">
                <img [src]="fav.imageUrl">
              </ion-avatar>
              <ion-label>
                {{fav.fullName}}
                <p>{{fav.family}}</p>
              </ion-label>
              <ion-badge slot="end" color="dark">{{fav.title | slice: 0: 20}}</ion-badge>
            </ion-item>

            <ion-item-options side="end">
              <ion-item-option color="danger" (click)="deleteFav(fav)">
                <ion-icon slot="icon-only" name="trash"></ion-icon>
              </ion-item-option>
            </ion-item-options>

          </ion-item-sliding>
        } @empty {
          <ion-item>
            <ion-text color="warning">
              <h2>No hay elementos favoritos</h2>
            </ion-text>

          </ion-item>
        }
      </swiper-slide>
    </swiper-container>
  </ion-list>

  <ion-fab slot="fixed" horizontal="end" vertical="bottom">
    <ion-fab-button>
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
    <ion-fab-list side="top">
      <ion-fab-button routerLink="/rm-characters">
        <ion-icon name="logo-ionitron"></ion-icon>
      </ion-fab-button>
    </ion-fab-list>
  </ion-fab>

</ion-content>
