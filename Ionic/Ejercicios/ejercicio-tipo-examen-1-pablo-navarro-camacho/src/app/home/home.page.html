<ion-header >
  <ion-toolbar color="primary" class="ion-padding">
    <ion-title> Valorant </ion-title>
    <ion-avatar slot="end" id="abrir-modal">
      <img  [src]="agents()[13]?.displayIcon"/>
    </ion-avatar>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    @for(agent of agents(); track agent.uuid)
    {
      @if (agent.description) {
        <ion-item-sliding>
          <ion-item>
            <ion-avatar slot="end">
              <img [src]="agent.displayIcon" />
            </ion-avatar>
            <ion-label>
              <h3>{{agent.displayName}}</h3>
              <p class="description">{{agent.description }}...</p>
            </ion-label>

          </ion-item>
          <ion-item-options side="start">

            <ion-item-option color="danger" (click)="infoHouse($event, agent.displayName)">
              <ion-icon name="home" slot="icon-only"></ion-icon>
            </ion-item-option>

          </ion-item-options>

          <ion-item-options side="end">

            <ion-item-option color="success" (click)="infoPlanet($event, agent.developerName)">
              <ion-icon name="planet" slot="icon-only"></ion-icon>
            </ion-item-option>

          </ion-item-options>
        </ion-item-sliding>
      }

    }
  </ion-list>

  <ion-infinite-scroll
    [disabled]="agentsAux.length === 0"
    (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content
      loadingText="Loading more...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

</ion-content>


<ion-modal #modal [trigger]="'abrir-modal'">
  <ng-template>
    <ion-content class="ion-padding ion-text-center">
      <img [src]="agents()[13]?.fullPortrait">
      <ion-label>
        <h3>{{ agents()[13]?.displayName }}</h3>
        <p>{{ agents()[13]?.description }}</p>
      </ion-label>

    </ion-content>

    <ion-footer class="ion-no-border">
      <ion-toolbar>
        <ion-buttons class="ion-display-flex ion-justify-content-between">
          <ion-button color="primary" (click)="modal.dismiss(null, 'cancel')">ACEPTAR</ion-button>
          <ion-button color="danger" (click)="modal.dismiss(null, 'cancel')">CANCELAR</ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-footer>

  </ng-template>
</ion-modal>
