<app-header/>

<ion-content class="ion-padding">
  <swiper-container [slidesPerView]="4.3">
    @for (category of categorys; track category.name){
      <swiper-slide>
        <ion-fab-button size="small" [color]="category.color" (click)="loadItems(category.name)">
          <ion-icon [name]="category.icon"></ion-icon>
        </ion-fab-button>
      </swiper-slide>
    }
  </swiper-container>

  @if (items().length === 0){
    <h3 class="ion-text-center">Select a category</h3>
  }

  <ion-list #lista>


      @for(item of items(); track item.id)
      {
        <ion-item-sliding>
          <ion-item>
            <ion-avatar slot="start">
              <ion-img [src]="item.image"></ion-img>
            </ion-avatar>
            <ion-label color="primary" >{{item.name}}</ion-label>
          </ion-item>
          <ion-item-options side="end">
            <ion-item-option color="primary" (click)="info($event,item.description)">
              <ion-icon name="information-circle-outline" slot="icon-only"></ion-icon>
            </ion-item-option>
          </ion-item-options>
        </ion-item-sliding>
      }
    </ion-list>

  <ion-infinite-scroll
    [disabled]="itemsAux.length === 0"
    (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content
      loadingText="Loading more...">
    </ion-infinite-scroll-content>
  </ion-infinite-scroll>

</ion-content>
