<ion-header>
  <ion-toolbar>
    <ion-title class="ion-text-center" color="dark">Extra</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <app-grid-home/>
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-avatar>
          <img [src]= "imageAvatar1()" alt="...">
        </ion-avatar>
      </ion-col>
      <ion-col>
        <ion-avatar>
          <img [src]= "imageAvatar2()" alt="...">
        </ion-avatar>
      </ion-col>
      <ion-col>
        <ion-avatar>
          <img [src]= "imageAvatar3()" alt="...">
        </ion-avatar>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col class="ion-text-center">
        <ion-button  color="success" size="default" fill="outline" shape="round" id="SelectFavourite">SELECT YOUR FAVOURITE</ion-button>
        <ion-action-sheet trigger="SelectFavourite" header="Select your Avatar"
                          [buttons]="SelectFauvorite"></ion-action-sheet>
      </ion-col>
    </ion-row>

  </ion-grid>


</ion-content>
