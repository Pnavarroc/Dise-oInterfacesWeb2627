<ion-header >
  <ion-toolbar>
    <ion-title class="ion-text-center">Personaje</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row class="ion-align-items-center">
      <ion-col size="4">
        <ion-avatar>
          <img [src]="character().avatar" alt="Avatar del personaje">
        </ion-avatar>
      </ion-col>

      <ion-col size="8">
        <ion-label>
          <h2>{{ character().role }}</h2>
          <p>{{ character().description }}</p>
        </ion-label>
      </ion-col>
    </ion-row>
  </ion-grid>


  <div class="ion-text-center">
    <ion-button class="ion-padding" id="SelectCharacter">
      Elegir Clase
    </ion-button>
  </div>

  <app-grid-go-inicio/>
</ion-content>

<ion-action-sheet trigger="SelectCharacter" header="Selecciona tu personaje"
                  [buttons]="SelectCharacter"></ion-action-sheet>
