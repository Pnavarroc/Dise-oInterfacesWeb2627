<ion-header>
  <ion-toolbar color="tertiary">
    <ion-title class="ion-text-center">Ejercicio 4</ion-title>
    <ion-button slot="end" routerLink="/productos-infinite">Productos</ion-button>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <swiper-container [slidesPerView]="4.2" [separator]="10">
        @for(slide of slides; track slide.text){
          <swiper-slide>
            <ion-button shape="round" [color]="slide.color" (click)="loadData(slide.text)">
              <ion-icon slot="icon-only" [name]="slide.icon"></ion-icon>
            </ion-button>
          </swiper-slide>
        }
  </swiper-container>

  @if(items().length ===0){
    <div class="ion-display-flex ion-justify-content-center">
      <h2><ion-text class="ion-text-center">Select a category</ion-text></h2>
    </div>
  }

  <ion-list>
    @for(item of itemsShow(); track item.id){
      <ion-item-sliding>
        <ion-item>
          <ion-avatar slot="start">
            <img [src]="item.image" alt="">
          </ion-avatar>
          <ion-label class="ion-text-capitalize" color="primary">{{item.name}}</ion-label>
        </ion-item>

        <ion-item-options side="end">
          <ion-item-option (click)="showMessage(item.description)">
            <ion-icon name="information-outline" slot="icon-only"></ion-icon>
          </ion-item-option>
        </ion-item-options>

      </ion-item-sliding>

    }

  </ion-list>

  <ion-infinite-scroll (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content loadingSpinner="dots" loadingText="Loading more..."></ion-infinite-scroll-content>
  </ion-infinite-scroll>

</ion-content>
