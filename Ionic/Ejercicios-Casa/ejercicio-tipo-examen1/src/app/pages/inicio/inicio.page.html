<app-menu-lateral/>
<ion-header>
  <ion-toolbar class="ion-padding" color="primary">
    <ion-title>Valorant</ion-title>
    <ion-avatar slot="end" id="abrir-modal">
      <img [src]="agentsShow()[13].displayIcon">
    </ion-avatar>
    <ion-menu-toggle slot="start" auto-hide="false" menu="menu-lateral">
      <ion-button color="tertiary" shape="round">
        <ion-icon name="menu-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-menu-toggle>
  </ion-toolbar>

  <ion-modal #modal trigger="abrir-modal">
    <ng-template>
      <ion-content>
        <ion-grid>
          <ion-row>
            <ion-col size="12">
              <img [src]="agentsShow()[13].fullPortrait">
            </ion-col>
            <div class="ion-padding">
              <ion-col size="12" >
                <ion-label>{{agentsShow()[13].displayName}}</ion-label>
              </ion-col>
              <ion-col size="12" >
                <p>{{agentsShow()[13].description}}</p>
              </ion-col>
            </div>

          </ion-row>
        </ion-grid>
      </ion-content>
      <ion-footer>
        <ion-toolbar>
          <ion-buttons slot="start">
            <ion-button color="primary" fill="clear" (click)="modal.dismiss()">Aceptar</ion-button>
          </ion-buttons>
          <ion-buttons slot="end">
            <ion-button color="danger" fill="clear" (click)="modal.dismiss()">Cancelar</ion-button>
          </ion-buttons>
        </ion-toolbar>
      </ion-footer>
    </ng-template>

  </ion-modal>
</ion-header>

<ion-content class="ion-padding" id="principal">

  <ion-fab slot="fixed" horizontal="end" vertical="bottom" >
    <ion-fab-button routerLink="/slides">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-list>
    @for(agent of agentsShow(); track agent.uuid){
      <ion-item-sliding>
        <ion-item>
          <ion-avatar slot="end">
            <img [src]="agent.displayIcon">
          </ion-avatar>
          <ion-label>
            {{agent.displayName}}
            <p>{{agent.description |slice: 0: 50}}...</p>
          </ion-label>
        </ion-item>

        <ion-item-options side="start">
          <ion-item-option color="danger" (click)="showToast('home', agent)">
            <ion-icon slot="icon-only" name="home"></ion-icon>
          </ion-item-option>
        </ion-item-options>
        <ion-item-options side="end">
          <ion-item-option color="success" (click)="showToast('planet', agent)">
            <ion-icon slot="icon-only" name="planet"></ion-icon>
          </ion-item-option>
        </ion-item-options>
      </ion-item-sliding>
    }
  </ion-list>

  <ion-infinite-scroll [disabled]="agents().length===0" (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content loadingSpinner="dots" loading-text="Esperando carga"></ion-infinite-scroll-content>
  </ion-infinite-scroll>



</ion-content>
