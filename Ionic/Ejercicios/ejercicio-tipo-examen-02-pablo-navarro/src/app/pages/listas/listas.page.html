<app-menu-lateral/>

<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-menu-toggle menu="menu-principal" slot="start" auto-hide="false" class="ion-padding">
      <ion-avatar>
        <img src="assets/images/AmongUs.jpg">
      </ion-avatar>
    </ion-menu-toggle>
    <ion-title color="primary">Materials</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding ion-text-center" id="principal">
  <ion-button id="abrir-modal">
    <ion-icon name="power" slot="icon-only"></ion-icon>
  </ion-button>

  <ion-modal #miModal trigger="abrir-modal">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-button slot="start" fill="clear" (click)="miModal.dismiss(mostrarCancel())">
            Cancel
          </ion-button>
          <ion-button slot="end" fill="clear" (click)="miModal.dismiss(mostrarAceptar(number()))">
            Aceptar
          </ion-button>
        </ion-toolbar>
      </ion-header>
      <ion-content class="ion-padding ion-text-center">
        <ion-row>
          <ion-col size="12">
            <ion-button (click)="randomNumber()" color="success">
              Random
            </ion-button>
          </ion-col>
          <ion-col size="12">
            <ion-text color="success">{{ number() }}</ion-text>
          </ion-col>
        </ion-row>


      </ion-content>
    </ng-template>

  </ion-modal>

  <ion-list>
    @for (material of materials(); track material.id) {
      <ion-item>
        <ion-label>
          <h3><strong>{{material.name}}</strong></h3>
          <ion-text>{{material.description | slice: 0: 38}}...</ion-text>
        </ion-label>

        <ion-avatar slot="end">
          <img [src]="material.image" alt="">
        </ion-avatar>
      </ion-item>
    }
  </ion-list>

</ion-content>
