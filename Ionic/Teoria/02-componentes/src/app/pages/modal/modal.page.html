<app-header titulo="Modal {{usuario.nombre || ''}}"/>

<ion-content class="ion-padding">
  <h3>{{message}}</h3>
  <ion-button id="abrir-modal" expand="block">Open</ion-button>
  <ion-item-divider></ion-item-divider>

  <p><strong>Nombre: </strong>{{usuario.nombre}}</p>
  <p><strong>Email: </strong>{{usuario.email}}</p>
  <p><strong>Ciudad: </strong>{{usuario.ciudad}}</p>

  <ion-modal trigger="abrir-modal" (willDismiss)="onWillDismiss($event)">
    <ng-template>
      <ion-header>
        <ion-toolbar>
          <ion-buttons>
            <ion-button (click)="cancel()">
              Cancel
            </ion-button>
            <ion-title>Bienvenido {{usuario.nombre}}</ion-title>
          </ion-buttons>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <form #formulario="ngForm" (ngSubmit)="onSubmitTemplate()">
          <ion-list>
            <ion-list-header>
              <ion-label>
                Formulario tempplate: Valid <span [ngClass]="{'red': !formulario.valid,  'green':formulario.valid}">{{formulario.valid}}</span>
              </ion-label>
            </ion-list-header>

            <ion-item>
              <ion-input type="text" name="Nombre" [(ngModel)]="usuario.nombre" [minlength]="4"
                labelPlacement="floating"
                         label="nombre"
                         errorText="Mínimo 4 caracteres"
                         [required]="true">

              ></ion-input>
            </ion-item>
            <ion-item>
              <ion-input type="text" name="Nombre" [(ngModel)]="usuario.email" [minlength]="4"
                         labelPlacement="floating"
                         label="email"
                         errorText="Mínimo 4 caracteres"
                         [required]="true">

                ></ion-input>
            </ion-item>
            <ion-item>
              <ion-input type="text" name="Nombre" [(ngModel)]="usuario.ciudad" [minlength]="4"
                         labelPlacement="floating"
                         label="ciudad"
                         errorText="Mínimo 4 caracteres"
                         [required]="true">

                ></ion-input>
            </ion-item>

          </ion-list>

          <ion-button expand="full" type="submit" [disabled]="!formulario.invalid">Enviar</ion-button>
        </form>
      </ion-content>

    </ng-template>
  </ion-modal>

</ion-content>
